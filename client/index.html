<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi Oasis - Nivel 0</title>
    <link rel="stylesheet" href="/avatar/editor.css" />
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
        canvas { display: block; }
        #hud {
        position: fixed; top: 12px; left: 12px; color: #fff; font: 13px/1.5 system-ui, sans-serif;
        background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px; pointer-events: none;
        }
        #hud b.ok { color: #6bff95; } #hud b.off { color: #ff6b6b; }
        #hud button { pointer-events: auto; margin-top: 8px; }
    </style>
    <script type="importmap">
        {"imports": { 
            "three": "/vendor/three/build/three.module.js",
            "three/addons/": "/vendor/three/examples/jsm/" 
        }}
    </script>
</head>
<body>
    <div id="hud">
        Red: <b id="status" class="off">conectando…</b> · Jugadores: <span id="count">0</span><br />
        Clic = capturar mouse · WASD / flechas = mover · Shift = correr · Espacio = saltar · Esc = soltar mouse
        <br /><button id="create-test" hidden>Crear cubo de prueba</button>
        <button id="edit-avatar" disabled>Editar avatar (V)</button>
        <span id="operation-status" role="status"></span>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
